AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  serverless-auth-demo

  Sample SAM Template for serverless-auth-demo

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true  # Hides the value in CloudFormation console outputs
    Description: Secret key for JWT signing (at least 256 bits for HS256)
  Stage:
    Type: String
    NoEcho: true  # Hides the value in CloudFormation console outputs
    Description: Stage name (e.g., dev, prod)


# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 20
    MemorySize: 512

Resources:
  SAMExampleApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,OPTIONS,PUT,PATCH,DELETE'"
        AllowHeaders: "'content-type,X-Custom-Header'"
        AllowOrigin: "'http://localhost:4000'"
        AllowCredentials: true
        MaxAge: "'600'"
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: com.auth.ChatHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        Variables:
          STAGE: !Ref Stage
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JwtSecret
      Events:
        Chat:
          Type: Api
          Properties:
            Path: /chat
            Method: post
            RestApiId: !Ref SAMExampleApi
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: com.auth.LoginHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        Variables:
          STAGE: !Ref Stage
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        Login:
          Type: Api
          Properties:
            Path: /login
            Method: post
            RestApiId: !Ref SAMExampleApi
  RegisterFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: AuthFunction
      Handler: com.auth.RegisterHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
        Variables:
          STAGE: !Ref Stage
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JwtSecret  # Accessible as process.env.JWT_SECRET in Lambda
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Register:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /register
            Method: post
            RestApiId: !Ref SAMExampleApi

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  RegisterApi:
    Description: "API Gateway endpoint URL for Register function"
    Value: !Sub "https://${SAMExampleApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/register/"
  UsersTableName:
    Description: "DynamoDB Users Table Name"
    Value: !Ref UsersTable